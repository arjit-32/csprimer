name: "💬 General Discussion & Content Requests"
description: "Request a new article, course, project series, or share a general idea."
title: "[Discussion]: "
labels: ["discussion"]
body:
  - type: dropdown
    id: discussion_type
    attributes:
      label: What is this discussion about?
      options:
        - "Request new article"
        - "Request new course"
        - "Request new Project / Project Series"
        - "General Idea"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Subject or Title
      placeholder: "e.g., Raft Consensus Algorithm, Distributed Tracing, or Go Project Series"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Details & Discussion Points
      description: "Explain what should be covered or your proposed ideas, and why it benefits learners."
      placeholder: "Share your thoughts or proposal..."
    validations:
      required: true
  - type: textarea
    id: outline
    attributes:
      label: Suggested Outline or Subtopics (Optional)
      placeholder: "- Part 1: ...\n- Part 2: ...\n- Part 3: ..."
    validations:
      required: false
